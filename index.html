<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afonso</title>
  <meta name="description" content="Personal site of Afonso">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --link: #0969da;
      --border: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --link: #4493f8;
        --border: #3d444d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--border); }
    li { padding: 12px 0; border-bottom: 1px solid var(--border); }
    a { color: var(--link); }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Afonso</h1>
    <p class="lead">Welcome to my corner of the web.</p>

    <ul>
      <li><a href="https://github.com/afonso-tsx">GitHub</a></li>
      <li><a href="privacy/">Privacy Policy</a></li>
    </ul>

    <footer>&copy; 2026 Afonso</footer>
  </main>
</body>
</html>
